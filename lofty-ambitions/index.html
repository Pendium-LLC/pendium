<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lofty Ambitions — a cozy pixel tower game</title>
  <meta name="description"
    content="Lofty Ambitions is a cozy pixel-art tower game. Build homes, open shops and look after the little people who live there." />
  <link rel="canonical" href="https://pendium.co/lofty-ambitions/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pendium.co/lofty-ambitions/" />
  <meta property="og:title" content="Lofty Ambitions — a cozy pixel tower game" />
  <meta property="og:description"
    content="Build homes, open shops and look after the little people who live there." />
  <meta property="og:image" content="https://pendium.co/lofty-ambitions/assets/og.jpg" />
  <meta property="og:image:width" content="1232" />
  <meta property="og:image:height" content="706" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pixelify+Sans:wght@500;700&display=swap"
    rel="stylesheet" />
  <style>
    /* Colours come from the game: its interface palette
       (Sources/TowerInterface/Palette.swift), the city art and the rooms. */
    :root {
      color-scheme: dark;
      --night: #0f1733;
      --ink: #2b2433;
      --ink-deep: #17121d;
      --parchment: #f3e8cf;
      --panel: #e9dcc0;
      --gold: #e0b35a;
      --gold-hi: #f4cd78;
      --coral: #ec6a54;
      --concrete: #4b5068;
      --concrete-lo: #2f3347;
      --pixel: "Pixelify Sans", ui-monospace, monospace;
      --sans: "Nunito", system-ui, sans-serif;
      --tower-w: min(1120px, 100vw - 32px);
      /* The tower is 704 sprite units wide: a 384-unit room, a 64-unit shaft, a 256-unit room. */
      --units: 704;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--night);
      color: var(--parchment);
      font-family: var(--sans);
      font-size: 18px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding-bottom: var(--banner-h, 0px);
    }

    a {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ---------- the sky: four times of day, crossfaded by the clock ---------- */

    .sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--night);
    }

    .sky-layer {
      position: absolute;
      inset: 0;
      background-position: center bottom;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 260ms linear;
    }

    /* One even shade over the whole sky, so text and the tower read on every time of day. */
    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 36, 0.28);
    }

    /* ---------- buttons ---------- */

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: 19px;
      line-height: 1;
      color: var(--ink);
      background: var(--gold);
      border: 3px solid var(--ink);
      border-radius: 0;
      padding: 13px 20px;
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 70ms ease, box-shadow 70ms ease, background 120ms ease;
    }

    .btn:hover {
      background: var(--gold-hi);
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn--quiet {
      background: #fffaf0;
    }

    .btn--quiet:hover {
      background: #fff;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      shape-rendering: crispEdges;
    }

    .btn .waves {
      display: none;
    }

    .btn[aria-pressed="true"] .waves {
      display: inline;
    }

    /* ---------- the hero sits on the roof ---------- */

    .roof {
      width: var(--tower-w);
      margin: 0 auto;
    }

    .roof-nav {
      display: flex;
      justify-content: flex-start;
      padding: 22px 0 18px;
    }

    .studio-link {
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      text-shadow: 0 2px 0 var(--ink);
    }

    .studio-link:hover {
      text-decoration: underline;
    }

    /* A parchment panel, like the game's own panels. */
    .intro {
      max-width: 520px;
      padding: 18px 22px;
      background: var(--parchment);
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .intro p {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* The title is a sign standing on the roof. It lights up at night. */
    .rooftop {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 48px;
    }

    .title {
      position: relative;
      margin: 0;
      padding: 0.2em 0.55em 0.24em;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: clamp(28px, 7vw, 96px);
      line-height: 1;
      white-space: nowrap;
      color: var(--parchment);
      background: var(--ink-deep);
      border: 4px solid var(--ink);
      box-shadow: inset 0 0 0 4px #3b3343, 6px 6px 0 rgba(0, 0, 0, 0.35);
      text-shadow: 0.05em 0.05em 0 var(--ink);
      transition: color 800ms ease, text-shadow 800ms ease;
    }

    /* A row of bulbs around the sign. */
    .title::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 4px dotted var(--gold);
      opacity: 0.35;
      transition: opacity 800ms ease, filter 800ms ease;
      pointer-events: none;
    }

    .is-night .title {
      color: #ffe6b0;
      text-shadow: 0 0 6px rgba(255, 179, 71, 0.9), 0 0 22px rgba(236, 106, 84, 0.7), 0.05em 0.05em 0 var(--ink);
    }

    .is-night .title::before {
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(255, 200, 100, 0.9));
    }

    .sign-legs {
      width: 64%;
      height: 34px;
      background:
        linear-gradient(90deg, transparent 8%, var(--ink) 8% 11%, transparent 11% 89%, var(--ink) 89% 92%, transparent 92%),
        linear-gradient(180deg, transparent 40%, var(--ink) 40% 52%, transparent 52%);
    }

    .parapet {
      height: 26px;
      background: repeating-linear-gradient(90deg, var(--concrete) 0 46px, var(--concrete-lo) 46px 48px);
      border: 3px solid var(--ink);
      border-bottom: 0;
      box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.12);
    }

    /* ---------- the tower: floors stacked like the game's cross-section ---------- */

    .tower {
      width: var(--tower-w);
      margin: 0 auto;
      border-left: 10px solid var(--concrete);
      border-right: 10px solid var(--concrete);
      outline: 3px solid var(--ink);
      background: var(--ink-deep);
    }

    .floors {
      position: relative;
    }

    .floor {
      position: relative;
      border-bottom: 3px solid var(--ink-deep);
    }

    .scene {
      position: relative;
      aspect-ratio: var(--units) / 88;
      overflow: hidden;
      image-rendering: pixelated;
    }

    .part {
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .part--left {
      left: 0;
      width: calc(384 / var(--units) * 100%);
    }

    .part--shaft {
      left: calc(384 / var(--units) * 100%);
      width: calc(64 / var(--units) * 100%);
      background:
        linear-gradient(90deg, #120e17 0 8%, #2a2431 8% 12%, transparent 12% 88%, #2a2431 88% 92%, #120e17 92%),
        repeating-linear-gradient(180deg, #1a1520 0 6px, #1d1724 6px 12px);
    }

    .part--right {
      left: calc(448 / var(--units) * 100%);
      width: calc(256 / var(--units) * 100%);
    }

    .art {
      position: absolute;
      inset: 0;
      background-image: var(--sprite);
      background-repeat: no-repeat;
      background-size: 100% calc(100% * var(--rows, 1));
      background-position: 0 calc(100% * var(--row, 0) / max(1, var(--rows, 1) - 1));
      image-rendering: pixelated;
    }

    /* A room. --ru is its width in sprite units, so people keep their size in any room. */
    .room {
      --ru: 384;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .part--right .room {
      --ru: 256;
    }

    /* A closed shop at night: the game's closed art plus dimmer light. */
    .room.is-closed::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(12, 16, 44, 0.42);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .sprite {
      position: absolute;
      background-image: var(--src);
      background-repeat: no-repeat;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .person {
      width: calc(28 / var(--ru) * 100%);
      height: calc(46 / 88 * 100%);
      bottom: calc(3 / 88 * 100%);
      background-size: 400% 100%;
    }

    .person.stroll {
      animation:
        walk-frames 0.6s steps(4) infinite,
        stroll var(--dur, 16s) linear infinite;
      animation-delay: 0s, var(--delay, 0s);
    }

    .person.stroll.face-left {
      transform: scaleX(-1);
      animation-direction: normal, reverse;
    }

    @keyframes walk-frames {
      to {
        background-position: 133.333% 0;
      }
    }

    @keyframes stroll {
      from {
        left: -8%;
      }

      to {
        left: 100%;
      }
    }

    /* Someone who just stepped out of the elevator. */
    .rider {
      transition: left 8s linear;
      animation: walk-frames 0.6s steps(4) infinite;
    }

    .rider.face-left {
      transform: scaleX(-1);
    }

    /* A pixel sign inside a room: the only UI on a floor. */
    .sign {
      position: absolute;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: clamp(11px, 1.2vw, 16px);
      line-height: 1.1;
      color: var(--ink);
      background: var(--gold);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 5px 9px;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    .sign:hover {
      background: var(--gold-hi);
    }

    .sign:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .callout {
      display: none;
      position: absolute;
      right: calc(100% + 26px);
      top: 50%;
      transform: translateY(-50%);
      width: max-content;
      max-width: 150px;
      font-family: var(--pixel);
      font-size: 16px;
      line-height: 1.25;
      text-align: right;
      color: var(--parchment);
      text-shadow: 0 2px 0 var(--ink);
    }

    .callout::after {
      content: "→";
      display: block;
      color: var(--gold);
    }

    @media (min-width: 1300px) {
      .callout {
        display: block;
      }
    }

    /* ---------- the elevator cab rides the shaft ---------- */

    .cab {
      position: absolute;
      z-index: 4;
      background: url("assets/sprites/lift-cab.png") center / 100% 100% no-repeat;
      image-rendering: pixelated;
      transition: top 1100ms cubic-bezier(0.45, 0, 0.25, 1);
      pointer-events: none;
    }

    .cab.is-moving {
      background-image: url("assets/sprites/lift-doors.png");
    }

    /* ---------- mishaps: something small and silly goes wrong in a room ---------- */

    .creature {
      --cw: calc(40 / var(--ru) * 100%);
      width: var(--cw);
      height: calc(28 / 88 * 100%);
      bottom: calc(4 / 88 * 100%);
      left: var(--x);
      background-size: 200% 100%;
      opacity: 0;
      transition: left 900ms cubic-bezier(0.4, 0, 0.2, 1), opacity 300ms ease, transform 300ms ease;
    }

    .creature.flies {
      bottom: 36%;
    }

    .is-loose .creature {
      opacity: 1;
      animation:
        creature-frames 0.35s steps(2) infinite,
        roll var(--dur, 4s) ease-in-out infinite alternate;
      animation-delay: 0s, var(--delay, 0s);
    }

    .is-loose .creature.flies {
      animation:
        creature-frames 0.35s steps(2) infinite,
        roll var(--dur, 4s) ease-in-out infinite alternate,
        bob 1.4s ease-in-out infinite alternate;
      animation-delay: 0s, var(--delay, 0s), var(--delay, 0s);
    }

    .is-gathered .creature {
      opacity: 1;
      animation: creature-frames 0.35s steps(2) infinite;
    }

    .is-gone .creature {
      opacity: 0;
      transform: scale(0.2) translateY(-60%);
    }

    @keyframes creature-frames {
      to {
        background-position: 200% 0;
      }
    }

    @keyframes roll {
      from {
        left: 3%;
      }

      to {
        left: calc(97% - var(--cw));
      }
    }

    @keyframes bob {
      to {
        transform: translateY(-40%);
      }
    }

    .mishap-sign {
      top: 7%;
      left: 3%;
      color: #fff;
      background: var(--coral);
      animation: blink 1s steps(2) infinite;
    }

    .mishap-sign:hover {
      background: #f2806c;
    }

    @keyframes blink {
      50% {
        background: #c94a37;
      }
    }

    .guard {
      left: -10%;
      opacity: 0;
    }

    .guard.is-coming {
      opacity: 1;
      left: 34%;
      transition: left 2.2s linear;
      animation: walk-frames 0.6s steps(4) infinite;
    }

    .guard.is-here {
      opacity: 1;
      left: 34%;
    }

    .guard.is-leaving {
      opacity: 1;
      left: 104%;
      transition: left 2.4s linear;
      animation: walk-frames 0.6s steps(4) infinite;
    }

    /* ---------- 8F: build homes ---------- */

    .lot {
      position: absolute;
      top: 0;
      bottom: 0;
      width: calc(100% / 3);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      font: inherit;
      color: inherit;
    }

    .lot:focus-visible {
      outline-offset: -4px;
    }

    .lot .art {
      --rows: 2;
      opacity: 0;
    }

    .lot::before {
      content: "";
      position: absolute;
      inset: calc(5 / 88 * 100%) 4% calc(5 / 88 * 100%);
      border: 2px dashed rgba(243, 232, 207, 0.35);
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 6px, transparent 6px 12px),
        rgba(20, 16, 26, 0.65);
    }

    .lot::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(5 / 88 * 100%);
      background: #57506a;
    }

    .lot .sign {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .lot:hover .sign {
      background: var(--gold-hi);
    }

    .lot[data-state="building"]::before,
    .lot[data-state="built"]::before,
    .lot[data-state="building"] .sign,
    .lot[data-state="built"] .sign {
      opacity: 0;
    }

    .lot[data-state="building"] .art {
      --row: 0;
      opacity: 1;
      animation: hammer 0.18s steps(2) infinite;
    }

    .lot[data-state="built"] .art {
      --row: 1;
      opacity: 1;
      animation: settle 420ms cubic-bezier(0.3, 1.5, 0.5, 1);
    }

    .lot[data-state="built"] {
      cursor: default;
    }

    @keyframes hammer {
      50% {
        transform: translateY(-1.5%);
      }
    }

    @keyframes settle {
      from {
        transform: scale(1.06);
        filter: brightness(1.5);
      }
    }

    .dust {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40%;
      background:
        radial-gradient(circle at 20% 80%, rgba(243, 232, 207, 0.55) 0 12%, transparent 13%),
        radial-gradient(circle at 55% 90%, rgba(243, 232, 207, 0.45) 0 16%, transparent 17%),
        radial-gradient(circle at 82% 75%, rgba(243, 232, 207, 0.5) 0 10%, transparent 11%);
      opacity: 0;
      pointer-events: none;
    }

    .lot[data-state="building"] .dust {
      animation: dust 0.5s steps(3) infinite;
    }

    @keyframes dust {
      0% {
        opacity: 0.9;
        transform: translateY(0) scale(0.9);
      }

      100% {
        opacity: 0;
        transform: translateY(-30%) scale(1.3);
      }
    }

    .lot .person {
      width: calc(28 / 128 * 100%);
      opacity: 0;
    }

    .lot[data-state="built"] .person {
      opacity: 1;
      animation:
        walk-frames 0.6s steps(4) infinite,
        pace 7s ease-in-out infinite;
    }

    @keyframes pace {

      0%,
      100% {
        left: 8%;
        transform: scaleX(1);
      }

      45% {
        left: 62%;
        transform: scaleX(1);
      }

      50% {
        left: 62%;
        transform: scaleX(-1);
      }

      95% {
        left: 8%;
        transform: scaleX(-1);
      }
    }

    /* ---------- 6F: the ramen bar opens for the night ---------- */

    .room-button {
      position: absolute;
      inset: 0;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .room-button:focus-visible {
      outline-offset: -4px;
    }

    .night {
      position: absolute;
      inset: 0;
      background: rgba(12, 16, 44, 0.66);
      mix-blend-mode: multiply;
      transition: opacity 500ms ease;
      pointer-events: none;
    }

    .lamps {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(9% 34% at 14.5% 18%, rgba(255, 170, 90, 0.75), transparent 70%),
        radial-gradient(9% 34% at 75.5% 18%, rgba(255, 170, 90, 0.75), transparent 70%),
        radial-gradient(45% 60% at 45% 0%, rgba(255, 196, 120, 0.3), transparent 70%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .room-button .sign {
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      background: var(--parchment);
      pointer-events: none;
    }

    .room-button:hover .sign {
      background: #fff6e0;
    }

    .switch {
      display: inline-block;
      width: 0.7em;
      height: 1em;
      background: var(--ink);
      position: relative;
    }

    .switch::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 2px;
      height: 40%;
      background: var(--gold);
    }

    .is-lit .night {
      opacity: 0;
    }

    .is-lit .lamps {
      opacity: 1;
      animation: lantern 3.2s ease-in-out infinite;
    }

    @keyframes lantern {
      50% {
        opacity: 0.82;
      }
    }

    .is-lit .room-button .sign {
      opacity: 0;
    }

    .ramen .person {
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .is-lit .ramen .person {
      opacity: 1;
    }

    .ramen .person.cook {
      left: 52%;
      animation: walk-frames 0.6s steps(4) infinite, cook 5s ease-in-out infinite;
    }

    .ramen .person.stroll,
    .ramen .person.cook {
      animation-play-state: paused;
    }

    .is-lit .ramen .person.stroll,
    .is-lit .ramen .person.cook {
      animation-play-state: running;
    }

    @keyframes cook {

      0%,
      100% {
        left: 38%;
        transform: scaleX(1);
      }

      48% {
        left: 62%;
        transform: scaleX(1);
      }

      52% {
        left: 62%;
        transform: scaleX(-1);
      }

      96% {
        left: 38%;
        transform: scaleX(-1);
      }
    }

    /* ---------- the lobby ---------- */

    .lobby .scene {
      aspect-ratio: var(--units) / 96;
    }

    .lobby .art {
      background-size: cover;
      background-position: center bottom;
    }

    .lobby .person {
      width: calc(28 / var(--units) * 100%);
      height: calc(46 / 96 * 100%);
      bottom: calc(6 / 96 * 100%);
    }

    /* ---------- the elevator panel ---------- */

    .elevator {
      position: fixed;
      right: 16px;
      top: calc(50% - var(--banner-h, 0px) / 2);
      transform: translateY(-50%);
      z-index: 10;
      padding: 10px;
      background: var(--ink);
      border: 3px solid var(--ink-deep);
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .clock {
      width: 100%;
      text-align: center;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: 15px;
      color: var(--parchment);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .clock .phase {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: rgba(243, 232, 207, 0.65);
      margin-top: 3px;
    }

    .display {
      width: 100%;
      background: var(--ink-deep);
      border: 2px solid #4a3f52;
      text-align: center;
      font-family: var(--pixel);
      font-weight: 700;
      color: var(--coral);
      text-shadow: 0 0 8px rgba(236, 106, 84, 0.7);
      padding: 4px 0 2px;
      line-height: 1;
    }

    .display .arrow {
      display: block;
      font-size: 13px;
      height: 13px;
    }

    .display .now {
      display: block;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
    }

    .floor-buttons {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, 36px);
      gap: 6px;
    }

    .floor-buttons a {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3b3343;
      border: 2px solid var(--ink-deep);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15);
      font-family: var(--pixel);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: var(--parchment);
    }

    .floor-buttons a:hover {
      background: #4a4153;
    }

    .floor-buttons a[aria-current="true"] {
      background: var(--gold);
      color: var(--ink);
      box-shadow: 0 0 12px rgba(224, 179, 90, 0.7);
    }

    /* ---------- the music button, floating top right ---------- */

    .music-btn {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--pixel);
      font-weight: 700;
      font-size: 15px;
      line-height: 1;
      color: var(--ink);
      background: var(--parchment);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 7px 11px;
      cursor: pointer;
    }

    .music-btn:hover {
      background: #fff6e0;
    }

    .music-btn[aria-pressed="true"] {
      background: var(--gold);
    }

    .music-btn svg {
      width: 18px;
      height: 18px;
      shape-rendering: crispEdges;
    }

    .music-btn .waves,
    .music-btn[aria-pressed="true"] .mute {
      display: none;
    }

    .music-btn[aria-pressed="true"] .waves {
      display: inline;
    }

    /* ---------- the launch banner across the bottom ---------- */

    .banner {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(23, 18, 29, 0.96);
      border-top: 3px solid var(--gold);
      box-shadow: 0 -6px 0 rgba(0, 0, 0, 0.25);
    }

    .signup {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .banner-text {
      font-family: var(--pixel);
      font-weight: 500;
      font-size: 16px;
      line-height: 1.3;
    }

    .signup input[type="email"] {
      width: 260px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fffaf0;
      border: 2px solid var(--ink);
      border-radius: 0;
      padding: 7px 10px;
    }

    .signup .btn {
      font-size: 16px;
      padding: 8px 14px;
      border-width: 2px;
      box-shadow: 3px 3px 0 #000;
    }

    .banner-close {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      font-family: var(--pixel);
      font-size: 22px;
      line-height: 1;
      color: var(--parchment);
      background: transparent;
      border: 2px solid rgba(243, 232, 207, 0.3);
      cursor: pointer;
    }

    .banner-close:hover {
      border-color: var(--parchment);
    }

    /* ---------- layout breakpoints ---------- */

    @media (min-width: 900px) {
      :root {
        --tower-w: min(1120px, 100vw - 240px);
      }
    }

    @media (max-width: 899px) {
      :root {
        /* On a phone the tower shows the left room and the shaft. */
        --units: 448;
      }

      .part--right {
        display: none;
      }

      .elevator {
        top: auto;
        bottom: calc(var(--banner-h, 0px) + 10px);
        right: 12px;
        transform: none;
        flex-direction: row;
        padding: 6px;
      }

      .floor-buttons {
        display: none;
      }

      .clock {
        width: auto;
        padding: 0 4px;
      }

      .display {
        width: 58px;
      }

      .sign {
        padding: 3px 7px;
        box-shadow: 2px 2px 0 var(--ink);
      }

      .rooftop {
        margin-top: 36px;
      }

      .banner {
        padding: 8px 10px;
        gap: 8px;
      }

      .banner-text {
        flex-basis: 100%;
        font-size: 14px;
      }

      .signup {
        justify-content: flex-start;
        gap: 8px;
      }

      .signup input[type="email"] {
        flex: 1;
        width: auto;
        min-width: 0;
      }

    }

    @media (max-width: 520px) {
      body {
        font-size: 17px;
      }

      .intro p {
        font-size: 17px;
      }

      .title {
        font-size: 42px;
        line-height: 1.05;
        white-space: normal;
        text-align: center;
      }

      .tower {
        border-left-width: 6px;
        border-right-width: 6px;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      .person,
      .person.stroll,
      .rider,
      .lot[data-state] .art,
      .lot[data-state] .dust,
      .lot[data-state="built"] .person,

      .cab,
      .rider,
      .sky-layer {
        transition: none !important;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 150) : ms));
      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      const say = (el, text) => {
        const s = el.closest(".floor")?.querySelector("[data-status]");
        if (s) s.textContent = text;
      };

      /* ---------- audio: the game's room music and sounds ---------- */
      const MUSIC_VOLUME = 0.55;
      const FADE = 1.2;
      const tracks = {};
      let ctx = null;
      let soundOn = false;
      let current = null;

      function track(name) {
        if (!tracks[name]) {
          const el = new Audio(`assets/audio/${name}.mp3`);
          el.loop = true;
          el.preload = "auto";
          const gain = ctx.createGain();
          gain.gain.value = 0;
          ctx.createMediaElementSource(el).connect(gain).connect(ctx.destination);
          tracks[name] = { el, gain, timer: null };
        }
        return tracks[name];
      }

      function fade(t, value) {
        const now = ctx.currentTime;
        t.gain.gain.cancelScheduledValues(now);
        t.gain.gain.setValueAtTime(t.gain.gain.value, now);
        t.gain.gain.linearRampToValueAtTime(value, now + FADE);
      }

      function fadeOut(name) {
        const t = tracks[name];
        if (!t) return;
        fade(t, 0);
        clearTimeout(t.timer);
        t.timer = setTimeout(() => t.el.pause(), FADE * 1000 + 100);
      }

      function playTrack(name) {
        if (!soundOn) return;
        Object.keys(tracks).forEach((other) => {
          if (other !== name) fadeOut(other);
        });
        if (!name) return;
        const t = track(name);
        clearTimeout(t.timer);
        if (t.el.paused) t.el.play().catch(() => { });
        fade(t, MUSIC_VOLUME);
      }

      function blip(name, volume = 0.6) {
        if (!soundOn) return;
        const el = new Audio(`assets/audio/${name}.mp3`);
        el.volume = volume;
        el.play().catch(() => { });
      }

      // The elevator bell, made from two tones.
      function ding() {
        if (!soundOn || !ctx) return;
        [[1318.5, 0], [1046.5, 0.18]].forEach(([freq, delay]) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          const t0 = ctx.currentTime + delay;
          osc.type = "sine";
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(0.1, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
          osc.connect(g).connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 1.2);
        });
      }

      // The ramen bar plays its own song only with its lights on.
      function trackFor(stop) {
        if (!stop) return null;
        if (stop.hasAttribute("data-needs-lights") && !stop.classList.contains("is-lit")) {
          return stop.dataset.trackDark || null;
        }
        return stop.dataset.track || null;
      }

      const toggles = document.querySelectorAll("[data-sound-toggle]");
      const toggleLabel = document.querySelector("[data-sound-label]");

      function setSound(on) {
        soundOn = on;
        toggles.forEach((b) => b.setAttribute("aria-pressed", String(on)));
        if (toggleLabel) toggleLabel.textContent = on ? "Stop music" : "Play music";
        if (on) {
          if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === "suspended") ctx.resume();
          playTrack(trackFor(current));
          blip("fx-pop");
        } else if (ctx) {
          Object.keys(tracks).forEach(fadeOut);
        }
      }

      toggles.forEach((b) => b.addEventListener("click", () => setSound(!soundOn)));

      /* ---------- 8F: build homes ---------- */
      const build = document.querySelector("[data-build]");
      const lots = [...build.querySelectorAll(".lot")];

      lots.forEach((lot, i) => {
        lot.addEventListener("click", async () => {
          if (lot.dataset.state !== "empty") return;
          lot.dataset.state = "building";
          lot.disabled = true;
          blip("fx-thud", 0.5);
          await wait(900);
          lot.dataset.state = "built";
          lot.setAttribute("aria-label", `Home ${i + 1}, built`);
          blip("fx-coin", 0.6);
          const built = lots.filter((l) => l.dataset.state === "built").length;
          say(build, built === lots.length ? "All three homes are built." : `Home ${i + 1} is built.`);
          if (built === lots.length) {
            await wait(300);
            blip("fx-fanfare", 0.5);
          }
        });
      });

      /* ---------- 6F: the ramen bar ---------- */
      const ramenBtn = document.querySelector("[data-ramen]");
      const ramenFloor = ramenBtn.closest(".floor");
      const ramenArt = ramenFloor.querySelector(".ramen > .art");

      ramenBtn.addEventListener("click", () => {
        const lit = !ramenFloor.classList.contains("is-lit");
        ramenFloor.classList.toggle("is-lit", lit);
        ramenArt.style.setProperty("--row", lit ? 1 : 0);
        ramenBtn.setAttribute("aria-pressed", String(lit));
        ramenBtn.setAttribute("aria-label", lit ? "Turn off the ramen bar lights" : "Turn on the ramen bar lights");
        say(ramenBtn, lit ? "The ramen bar is open." : "The ramen bar is closed.");
        if (lit) {
          // Opening the bar is a request for its song.
          if (!soundOn) setSound(true);
          blip("fx-pop", 0.5);
        }
        if (current === ramenFloor) playTrack(trackFor(ramenFloor));
      });

      /* ---------- mishaps, as in the game: something silly gets loose, you call a helper ---------- */
      function visible(el) {
        if (!el.offsetParent) return false;
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.bottom > 0 && r.top < window.innerHeight;
      }

      const mishaps = [...document.querySelectorAll("[data-mishap]")].map((room) => {
        const kind = room.dataset.mishap;
        const helper = room.dataset.helper;
        const count = Number(room.dataset.count) || 3;
        const flies = room.hasAttribute("data-flies");
        const creatures = [];
        for (let i = 0; i < count; i += 1) {
          const c = document.createElement("span");
          c.className = `sprite creature${flies ? " flies" : ""}`;
          const home = `${12 + (i * 70) / count}%`;
          c.dataset.home = home;
          c.style.setProperty("--src", `url(assets/sprites/mishap-${kind}.png)`);
          c.style.setProperty("--x", home);
          c.style.setProperty("--dur", `${(2.8 + Math.random() * 2).toFixed(2)}s`);
          c.style.setProperty("--delay", `${(-Math.random() * 3).toFixed(2)}s`);
          room.appendChild(c);
          creatures.push(c);
        }
        const guard = document.createElement("span");
        guard.className = "sprite person guard";
        guard.style.setProperty("--src", "url(assets/sprites/walk-security.png)");
        room.appendChild(guard);
        const sign = document.createElement("button");
        sign.type = "button";
        sign.className = "sign mishap-sign";
        sign.textContent = `Call ${helper}`;
        sign.hidden = true;
        room.appendChild(sign);
        const m = { room, helper, creatures, guard, sign, state: "idle", rest: 0, timer: null };
        sign.addEventListener("click", () => resolve(m));
        return m;
      });

      function startMishap(m) {
        if (m.state !== "idle") return;
        m.state = "loose";
        m.room.classList.add("is-loose");
        m.sign.hidden = false;
        say(m.room, `Something got loose. ${m.sign.textContent} to fix it.`);
        blip("disaster-zing", 0.35);
        // Left alone, the helper turns up on their own after a while.
        m.timer = setTimeout(() => resolve(m), 30000);
      }

      async function resolve(m) {
        if (m.state !== "loose") return;
        clearTimeout(m.timer);
        m.state = "helping";
        m.sign.hidden = true;
        blip("fx-zip", 0.45);
        m.guard.className = "sprite person guard is-coming";
        await wait(2300);
        m.guard.className = "sprite person guard is-here";
        // Freeze each creature where it is, then slide it next to the helper.
        const w = m.room.offsetWidth;
        m.creatures.forEach((c) => c.style.setProperty("--x", `${(c.offsetLeft / w) * 100}%`));
        m.room.classList.remove("is-loose");
        void m.room.offsetWidth;
        m.room.classList.add("is-gathered");
        m.creatures.forEach((c, i) => c.style.setProperty("--x", `${46 + i * 9}%`));
        await wait(1200);
        m.room.classList.add("is-gone");
        blip("fx-coin", 0.5);
        say(m.room, "All sorted.");
        await wait(400);
        m.guard.className = "sprite person guard is-leaving";
        await wait(2500);
        m.guard.className = "sprite person guard";
        m.room.classList.remove("is-gathered", "is-gone");
        m.creatures.forEach((c) => c.style.setProperty("--x", c.dataset.home));
        m.state = "idle";
        m.rest = Date.now() + 25000;
      }

      // Every few seconds a mishap may start in a room you can see. Two at most at a time.
      setInterval(() => {
        if (document.hidden) return;
        const now = Date.now();
        if (mishaps.filter((m) => m.state !== "idle").length >= 2) return;
        const pool = mishaps.filter((m) => m.state === "idle" && now > m.rest &&
          !m.room.classList.contains("is-closed") && visible(m.room));
        if (pool.length && Math.random() < 0.6) startMishap(pick(pool));
      }, 4000);

      /* ---------- the elevator: the cab, its riders and the panel ---------- */
      const roof = document.getElementById("roof");
      const floorsEl = document.querySelector(".floors");
      const floors = [...document.querySelectorAll(".floor")];
      const stops = [roof, ...floors];
      const shaftFloors = floors.filter((f) => f.querySelector(".part--shaft"));
      const cab = document.querySelector(".cab");
      const nowEl = document.querySelector("[data-now]");
      const arrowEl = document.querySelector("[data-arrow]");
      const buttons = [...document.querySelectorAll("[data-go]")];
      const RIDERS = ["civilian0", "civilian1", "civilian2", "civilian3"];
      let cabFloor = shaftFloors[0];
      let riderWaiting = false;
      let lastScroll = 0;
      let ticking = false;

      // A rider steps out of the cab and walks into a room next to the shaft.
      function dropRider(floor) {
        const rooms = [...floor.querySelectorAll("[data-rider]")].filter((r) => r.offsetParent);
        if (!rooms.length) return;
        const room = pick(rooms);
        const fromRight = !!room.closest(".part--left");
        const p = document.createElement("span");
        p.className = `sprite person rider${fromRight ? " face-left" : ""}`;
        p.style.setProperty("--src", `url(assets/sprites/walk-${pick(RIDERS)}.png)`);
        p.style.left = fromRight ? "95%" : "-6%";
        room.appendChild(p);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          p.style.left = fromRight ? "-12%" : "104%";
        }));
        setTimeout(() => p.remove(), 8600);
      }

      function cabTop(floor) {
        const shaft = floor.querySelector(".part--shaft");
        const box = floorsEl.getBoundingClientRect();
        const r = shaft.getBoundingClientRect();
        const unit = r.height / 88;
        return { top: r.top - box.top + 24 * unit, left: r.left - box.left + 8 * unit, unit };
      }

      function sizeCab() {
        const { top, left, unit } = cabTop(cabFloor);
        cab.style.transition = "none";
        cab.style.width = `${48 * unit}px`;
        cab.style.height = `${60 * unit}px`;
        cab.style.left = `${left}px`;
        cab.style.top = `${top}px`;
        void cab.offsetWidth;
        cab.style.transition = "";
      }

      function arrive() {
        cab.classList.remove("is-moving");
        arrowEl.textContent = "";
        nowEl.textContent = cabFloor.dataset.label;
        ding();
        if (riderWaiting) dropRider(cabFloor);
        riderWaiting = false;
      }

      function cabGo(floor, withRider) {
        if (floor === cabFloor) {
          if (withRider) dropRider(floor);
          return;
        }
        const goingDown = shaftFloors.indexOf(floor) > shaftFloors.indexOf(cabFloor);
        cabFloor = floor;
        riderWaiting = withRider;
        const { top } = cabTop(floor);
        if (reduceMotion) {
          cab.style.top = `${top}px`;
          arrive();
          return;
        }
        arrowEl.textContent = goingDown ? "▼" : "▲";
        cab.classList.add("is-moving");
        cab.style.top = `${top}px`;
      }

      cab.addEventListener("transitionend", (e) => {
        if (e.propertyName === "top") arrive();
      });

      // When you stop scrolling, the cab keeps busy with short trips between floors you can see.
      setInterval(() => {
        if (document.hidden || Date.now() - lastScroll < 4000 || cab.classList.contains("is-moving")) return;
        const options = shaftFloors.filter((f) => f !== cabFloor && visible(f));
        if (options.length) cabGo(pick(options), true);
      }, 6500);

      function nearestStop() {
        const mid = window.innerHeight / 2;
        let best = stops[0];
        let bestDist = Infinity;
        stops.forEach((s) => {
          const r = s.getBoundingClientRect();
          const d = Math.abs(r.top + r.height / 2 - mid);
          if (d < bestDist) {
            bestDist = d;
            best = s;
          }
        });
        return best;
      }

      const pizza = mishaps.find((m) => m.room.hasAttribute("data-pizza"));
      let pizzaStarted = false;

      function update() {
        ticking = false;

        // The meatballs get loose the first time the pizza parlor is in view.
        if (!pizzaStarted && pizza) {
          const r = pizza.room.getBoundingClientRect();
          if (r.top < window.innerHeight * 0.75 && r.bottom > 0) {
            pizzaStarted = true;
            startMishap(pizza);
          }
        }

        const stop = nearestStop();
        if (stop === current) return;
        if (current) current.classList.remove("is-current");
        current = stop;
        current.classList.add("is-current");
        buttons.forEach((b) => b.setAttribute("aria-current", String(b.dataset.go === current.id)));
        playTrack(trackFor(current));

        // The cab comes to the floor you are looking at.
        const target = current === roof ? shaftFloors[0]
          : shaftFloors.includes(current) ? current : shaftFloors[shaftFloors.length - 1];
        cabGo(target, Math.random() < 0.5);
      }

      function requestUpdate() {
        lastScroll = Date.now();
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      }

      sizeCab();
      update();

      window.addEventListener("scroll", requestUpdate, { passive: true });
      window.addEventListener("resize", () => {
        sizeCab();
        requestUpdate();
      });

      buttons.forEach((b) => {
        b.addEventListener("click", (event) => {
          const target = document.getElementById(b.dataset.go);
          if (!target) return;
          event.preventDefault();
          blip("fx-zip", 0.45);
          target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: target === roof ? "start" : "center" });
          history.replaceState(null, "", `#${b.dataset.go}`);
        });
      });

      /* ---------- a day passes: one game day in about four minutes ---------- */
      const SKY_KEYS = [
        [0, "night"], [300, "night"], [390, "sunrise"], [480, "day"],
        [990, "day"], [1080, "sunset"], [1170, "night"], [1440, "night"],
      ];
      const layers = Object.fromEntries([...document.querySelectorAll("[data-sky]")].map((l) => [l.dataset.sky, l]));
      const clockEl = document.querySelector("[data-clock]");
      const phaseEl = document.querySelector("[data-phase]");
      const shops = [...document.querySelectorAll("[data-shop]")];
      let minutes = 16 * 60 + 30;

      function renderTime() {
        const weights = { night: 0, sunrise: 0, day: 0, sunset: 0 };
        let from = "night";
        let to = "night";
        let f = 0;
        for (let i = 0; i < SKY_KEYS.length - 1; i += 1) {
          const [a, sa] = SKY_KEYS[i];
          const [b, sb] = SKY_KEYS[i + 1];
          if (minutes >= a && minutes < b) {
            f = (minutes - a) / (b - a);
            from = sa;
            to = sb;
            weights[sa] += 1 - f;
            weights[sb] += f;
            break;
          }
        }
        // The earlier sky shows in full underneath; the next one fades in on top of it.
        Object.entries(layers).forEach(([name, layer]) => {
          if (name === from) {
            layer.style.zIndex = 1;
            layer.style.opacity = 1;
          } else if (name === to) {
            layer.style.zIndex = 2;
            layer.style.opacity = f;
          } else {
            layer.style.zIndex = 0;
            layer.style.opacity = 0;
          }
        });

        const shown = Math.floor(minutes / 10) * 10;
        clockEl.textContent = `${String(Math.floor(shown / 60)).padStart(2, "0")}:${String(shown % 60).padStart(2, "0")}`;
        const night = minutes >= 1170 || minutes < 330;
        phaseEl.textContent = night ? "Night" : weights.sunrise > 0.5 ? "Sunrise" : weights.sunset > 0.5 ? "Sunset" : "Day";
        document.body.classList.toggle("is-night", night);

        // Shops close from 22:00 to 08:00. Homes stay open.
        const closed = minutes >= 1320 || minutes < 480;
        shops.forEach((room) => {
          if (room.classList.contains("is-closed") === closed) return;
          room.classList.toggle("is-closed", closed);
          room.querySelector(".art").style.setProperty("--row", closed ? 1 : 0);
        });
      }

      renderTime();
      setInterval(() => {
        minutes = (minutes + 1.5) % 1440;
        renderTime();
      }, 250);

      /* ---------- the launch banner ---------- */
      const banner = document.querySelector("[data-banner]");
      const setBannerSpace = () => {
        const h = banner.hidden ? 0 : banner.offsetHeight;
        document.documentElement.style.setProperty("--banner-h", `${h}px`);
      };
      try {
        if (localStorage.getItem("lofty-banner-closed") === "1") banner.hidden = true;
      } catch (e) { /* storage blocked: keep the banner */ }
      if (window.ResizeObserver) new ResizeObserver(setBannerSpace).observe(banner);
      setBannerSpace();
      document.querySelector("[data-banner-close]").addEventListener("click", () => {
        banner.hidden = true;
        setBannerSpace();
        try {
          localStorage.setItem("lofty-banner-closed", "1");
        } catch (e) { /* storage blocked: closes for this visit only */ }
      });

      /* ---------- sign-up ---------- */
      const signup = document.querySelector("[data-signup]");
      signup.addEventListener("submit", (event) => {
        if (!soundOn || signup.dataset.sent) return;
        event.preventDefault();
        signup.dataset.sent = "1";
        blip("fx-coin", 0.8);
        setTimeout(() => signup.submit(), 350);
      });
    })();
  </script>
</body>

</html>
